[package]
name = "tuiji"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = [
  "serde",
  "event-stream",
  "filedescriptor",
] }
futures = "0.3.31"
env_logger = "0.11.8"
gouqi = { version = "0.20.0", features = ["full"] }
log = { version = "0.4.29", features = ["serde"] }
ratatui = { version = "0.29.0", features = [
  "all-widgets",
  "document-features",
  "macros",
  "serde",
  "palette",
] }
reqwest = { version = "0.12.24", features = ["json", "rustls-tls"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
toml = { version = "0.9.8" }
uuid = { version = "1.19.0", features = ["serde", "v7"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
