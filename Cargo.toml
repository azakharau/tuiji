[package]
name = "tuiji"
version = "0.1.0"
edition = "2024"
description = "Terminal User Interface for Jira with offline-first synchronization"
license = "MIT"
repository = "https://github.com/azakharau/tuiji"
readme = "README.md"
keywords = ["jira", "tui", "terminal", "ratatui", "offline"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.95"

[dependencies]
async-trait = "0.1.92"
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = [
  "serde",
  "event-stream",
  "filedescriptor",
] }
futures = "0.3.34"
env_logger = "0.11.11"
gouqi = { version = "0.20.0", features = ["full", "async"] }
log = { version = "0.4.34", features = ["serde"] }
ratatui = { version = "0.30.2", features = [
  "all-widgets",
  "macros",
  "serde",
  "palette",
  "unstable-rendered-line-info",
  "unstable-widget-ref",
] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = [
  "macros",
  "migrate",
  "runtime-tokio",
  "tls-rustls",
  "sqlite",
] }
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.53.1", features = ["full"] }
toml = { version = "1.1.4" }
uuid = { version = "1.26.0", features = ["serde", "v7"] }
tui-input = "0.15.4"

[dev-dependencies]
wiremock = "0.6.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
