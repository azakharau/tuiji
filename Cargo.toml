[package]
name = "tuiji"
version = "0.1.0"
edition = "2024"
description = "Terminal User Interface for Jira with offline-first synchronization"
license = "MIT"
repository = "https://github.com/tuijiorg/tuiji"
readme = "README.md"
keywords = ["jira", "tui", "terminal", "ratatui", "offline"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
async-trait = "0.1.89"
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = [
  "serde",
  "event-stream",
  "filedescriptor",
] }
futures = "0.3.31"
env_logger = "0.11.8"
gouqi = { version = "0.20.0", features = ["full", "async"] }
log = { version = "0.4.29", features = ["serde"] }
ratatui = { version = "0.29.0", features = [
  "all-widgets",
  "document-features",
  "macros",
  "serde",
  "palette",
  "unstable-rendered-line-info",
  "unstable-widget-ref",
] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", features = ["macros", "migrate", "runtime-tokio-rustls", "sqlite"] }
thiserror = "2.0.17"
time = { version = "0.3.36", features = ["formatting"] }
tokio = { version = "1.48.0", features = ["full"] }
toml = { version = "0.9.8" }
uuid = { version = "1.19.0", features = ["serde", "v7"] }
tui-input = "0.14.0"

[dev-dependencies]
wiremock = "0.6.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
